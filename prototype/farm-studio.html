<title>Farm Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width app column (centered on desktop) — HUD on top, isometric farm stage, tab bar at the bottom; sheets slide up over it. */
:root{
  --bg:#E7EBDA; --surface:#FBFAF3; --surface-2:#F1F0E3; --line:#D6D9C4;
  --ink:#1E2819; --muted:#5D6853;
  --olive:#47672A; --olive-ink:#FFFFFF; --leaf:#77A53F;
  --sun:#D98E1F; --sun-soft:#FBE7C2;
  --water:#2F7FB5; --water-soft:#D6E9F5;
  --frost:#4FA3E0; --danger:#C2412B; --danger-soft:#F6DCD5; --warn:#C99512; --warn-soft:#F7ECC8; --ok:#3F8A3A; --ok-soft:#DCEED6;
  --sky-top:#BFE0F0; --sky-bot:#EAF3E3;
  --grass:#83B24A; --grass-dk:#5E8A33; --soil:#A9774A; --soil-dk:#7A5131; --soil-wet:#6E4A2C;
  --shadow:0 6px 20px rgba(40,50,20,.14);
  --f-display:"Baloo Bhaijaan 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10150D; --surface:#1B2317; --surface-2:#232D1E; --line:#33402B;
  --ink:#E9EFDE; --muted:#A0AD93;
  --olive:#9CC65C; --olive-ink:#13200A; --leaf:#8DBD52;
  --sun:#F0AE45; --sun-soft:#3B2E14;
  --water:#6AB4E6; --water-soft:#16303F;
  --frost:#7CC0F0; --danger:#F07A63; --danger-soft:#3D1D17; --warn:#E8C04A; --warn-soft:#3A3215; --ok:#7CC473; --ok-soft:#1C3319;
  --sky-top:#1C3346; --sky-bot:#22301F;
  --grass:#5F8C33; --grass-dk:#40651F; --soil:#8A5F3A; --soil-dk:#5C3E24; --soil-wet:#4F3420;
  --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10150D; --surface:#1B2317; --surface-2:#232D1E; --line:#33402B;
  --ink:#E9EFDE; --muted:#A0AD93;
  --olive:#9CC65C; --olive-ink:#13200A; --leaf:#8DBD52;
  --sun:#F0AE45; --sun-soft:#3B2E14;
  --water:#6AB4E6; --water-soft:#16303F;
  --frost:#7CC0F0; --danger:#F07A63; --danger-soft:#3D1D17; --warn:#E8C04A; --warn-soft:#3A3215; --ok:#7CC473; --ok-soft:#1C3319;
  --sky-top:#1C3346; --sky-bot:#22301F;
  --grass:#5F8C33; --grass-dk:#40651F; --soil:#8A5F3A; --soil-dk:#5C3E24; --soil-wet:#4F3420;
  --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:var(--shadow)}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;overflow-y:auto;min-height:0;padding-block:16px 24px}

/* buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-family:var(--f-display);font-weight:700;font-size:17px;background:var(--olive);color:var(--olive-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sun{background:var(--sun);color:#2A1A00}
.btn.water{background:var(--water);color:#fff}
.btn.block{width:100%}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.toggle[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
:root[dir="rtl"] .label{letter-spacing:0;text-transform:none;font-size:13px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}

/* welcome */
.welcome{position:relative;flex:1;display:flex;flex-direction:column;background:linear-gradient(var(--sky-top),var(--sky-bot))}
.welcome canvas{flex:1;width:100%;min-height:0;display:block}
.welcome .panel{background:var(--surface);border-radius:24px 24px 0 0;padding-block:22px 22px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:42px;height:42px;border-radius:12px;background:var(--olive);display:grid;place-items:center}
.logo h1{font-size:34px;letter-spacing:-.01em}
.welcome p{margin:6px 0 16px;color:var(--muted);max-width:40ch}
.lang-switch{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));z-index:2}

/* onboarding */
.ob-head{padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--olive)}
.ob-foot{padding-block:12px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--surface)}
.ob-foot .btn{flex:1}
.map-wrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);touch-action:none}
.map-wrap canvas{display:block;width:100%;height:280px}
.map-coords{position:absolute;left:8px;bottom:8px;background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;border:1px solid var(--line)}
.map-loc{position:absolute;right:8px;top:8px}
input[type=range]{width:100%;accent-color:var(--olive)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.field .err{color:var(--danger);font-size:13px}
.field.bad input,.field.bad select{border-color:var(--danger)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--olive)}
.src-list{display:flex;flex-direction:column;gap:8px}
.src{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.src .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.src.loading .dot{border-color:var(--water);border-top-color:transparent;animation:spin .8s linear infinite}
.src.done .dot{background:var(--ok);border-color:var(--ok)}
.src small{display:block;color:var(--muted);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.metric b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.metric span{font-size:12px;color:var(--muted)}
.rec{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--line)}
.rec[aria-pressed="true"]{border-color:var(--olive);background:color-mix(in srgb,var(--olive) 9%,var(--surface))}
.rec canvas{width:44px;height:44px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.rec[aria-pressed="true"] .check{background:var(--olive);border-color:var(--olive)}

/* farm HUD */
.hud{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.plot-btn{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:0;min-width:0;flex:1 1 100%;text-align:start}
.plot-btn b{font-family:var(--f-display);font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plot-btn span{font-size:12px;color:var(--muted)}
.rp{background:var(--sun-soft);border-color:transparent;color:var(--ink)}
.rp .coin{width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.grade{font-family:var(--f-display);font-weight:800}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot))}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 18px color-mix(in srgb,var(--frost) 70%,transparent);opacity:0;transition:opacity .6s}
.vignette.on{opacity:1}
.banner{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:96px;background:var(--surface);border-radius:14px;padding:9px 11px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.banner .sev{width:8px;align-self:stretch;border-radius:8px;background:var(--frost)}
.banner b{font-size:14px;display:block}
.banner small{color:var(--muted);font-size:12px}
.banner button{margin-inline-start:auto}
.weekbtn{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;background:var(--ink);color:var(--surface);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;max-width:calc(100% - 130px);width:max-content;text-align:center;pointer-events:none;border-radius:14px}
.sidebar{position:absolute;top:10px;bottom:10px;right:max(8px,env(safe-area-inset-right,0px));width:80px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);border-radius:18px;padding:6px;box-shadow:var(--shadow);overflow-y:auto}
.sb-crop{flex-shrink:0;position:relative;border:2px solid transparent;background:var(--surface-2);border-radius:14px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sb-crop canvas{width:40px;height:40px}
.sb-crop b{font-size:11px;line-height:1.15}
.sb-crop small{font-size:10px;line-height:1.15;color:var(--muted);text-align:center}
.sb-crop[aria-pressed="true"]{border-color:var(--olive);background:color-mix(in srgb,var(--olive) 14%,var(--surface))}
.sb-crop .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;color:#fff}
.badge.w{background:var(--water)} .badge.h{background:var(--sun);color:#2A1A00}
.sb-sep{height:1px;background:var(--line);margin:2px 4px}
.tool{flex-shrink:0;border:2px solid transparent;background:var(--surface-2);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
.tool svg{width:28px;height:28px}
.tool[aria-pressed="true"]{border-color:var(--sun);background:var(--sun-soft)}
.drag-sickle{position:fixed;width:56px;height:56px;pointer-events:none;z-index:50;transform:translate(-50%,-70%) rotate(-20deg)}

/* tabs */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--olive)}
.tab .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:9px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

/* panels */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title h2{font-size:22px}
.cal{overflow-x:auto}
.cal table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:300px;font-size:12px;table-layout:fixed}
.cal th:first-child{width:84px}
.cal th{font-weight:600;color:var(--muted);text-align:center;font-size:11px}
.cal td{padding:0;height:22px;position:relative}
.cal td.name{white-space:nowrap;padding-inline-end:8px;font-weight:600;font-size:13px}
.cal .seg-p{background:var(--leaf);opacity:.55}
.cal .seg-g{background:var(--leaf)}
.cal .seg-h{background:var(--sun)}
.cal .now{box-shadow:inset 2px 0 0 var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px}
.note{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--warn-soft);font-size:14px}
.note.info{background:var(--water-soft)}
.note.ok{background:var(--ok-soft)}
.wbar{display:grid;grid-template-columns:90px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.wbar .track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;position:relative}
.wbar .track i{position:absolute;inset:0 auto 0 0;border-radius:7px}
:root[dir="rtl"] .wbar .track i{inset:0 0 0 auto}
.grade-big{font-family:var(--f-display);font-size:54px;line-height:1;font-weight:800;color:var(--olive)}
.spray-grid{display:grid;grid-template-columns:56px repeat(8,minmax(0,1fr));gap:4px;font-size:11px}
.spray-grid .h{color:var(--muted);text-align:center;font-weight:600}
.spray-grid .d{font-weight:700;font-size:12px;align-self:center}
.slot{border:0;border-radius:8px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;padding:0;line-height:1.1}
.slot.g{background:var(--ok-soft);color:var(--ok)} .slot.y{background:var(--warn-soft);color:var(--warn)} .slot.r{background:var(--danger-soft);color:var(--danger)}
.slot.sel{outline:3px solid var(--ink);outline-offset:-3px}
.slot svg{width:14px;height:14px}
.alert{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.alert .sev{border-radius:6px}
.alert h3{font-size:18px}
.alert .act{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:14px}
.alert .act.done{opacity:.6;text-decoration:line-through}
.alert.resolved{opacity:.65}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:2px solid transparent;width:100%;text-align:start}
.list-item.on{border-color:var(--olive)}
.src-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}

/* sheet, toast, coach */
.backdrop{position:absolute;inset:0;background:rgba(10,15,5,.45);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:80%;overflow-y:auto;padding-block:10px 22px;padding-bottom:max(22px,env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2);animation:up .25s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-8px);opacity:0}}
.coach-ring{position:absolute;z-index:30;border-radius:18px;box-shadow:0 0 0 9999px rgba(8,12,4,.62);border:3px solid var(--sun);pointer-events:none;transition:all .3s}
.coach-card{position:absolute;z-index:31;left:16px;right:16px;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.coach-card h3{font-size:20px;margin-bottom:4px}
.coach-card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--olive)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">

  <!-- WELCOME -->
  <section class="screen" id="scr-welcome">
    <div class="welcome">
      <button class="chip lang-switch" data-act="lang" aria-label="Switch language"><span data-t="langBtn"></span></button>
      <canvas id="welcomeCanvas" aria-hidden="true"></canvas>
      <div class="panel pad">
        <div class="logo">
          <div class="logo-mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 21V10"/><path d="M12 13c-4 0-6-3-6-6 3 0 6 2 6 6Z" fill="#fff" fill-opacity=".25"/><path d="M12 11c0-4 3-7 7-7 0 4-3 7-7 7Z" fill="#fff" fill-opacity=".25"/><circle cx="18.5" cy="18.5" r="2.3"/></svg></div>
          <h1 data-t="appName"></h1>
        </div>
        <p data-t="tagline"></p>
        <div class="stack" style="gap:10px">
          <button class="btn block" data-act="startOnboard" data-t="startNew"></button>
          <button class="btn ghost block" data-act="openSample"><span data-t="openSample"></span></button>
          <div class="row" style="justify-content:center"><span class="tag" data-t="demoNote"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ONBOARDING -->
  <section class="screen" id="scr-onboard" hidden>
    <div class="ob-head pad">
      <div class="row between"><span class="label" id="obStepLabel"></span><button class="chip" data-act="lang"><span data-t="langBtn"></span></button></div>
      <div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i></div>
    </div>

    <div class="scroll pad" id="ob1">
      <div class="stack">
        <div><h2 data-t="ob1Title" style="font-size:26px"></h2><p class="muted" style="margin:4px 0 0" data-t="ob1Sub"></p></div>
        <div class="map-wrap">
          <canvas id="mapCanvas" aria-label="Map of the Jordan Valley and Amman area"></canvas>
          <button class="btn sm map-loc" data-act="locate"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span data-t="useLoc"></span></button>
          <span class="map-coords mono" id="coords"></span>
        </div>
        <div class="card stack" style="gap:10px">

function drawCrop(g,id,x,y,s,stage){ // x,y = ground point; s = scale (tile half-width ~ 1)
  const C=CROPS[id];const st=Math.max(0,stage);const k=.45+.55*Math.min(st,3)/3;
  const leaf=st>=4?"#8FB33A":"#4E8E2E",leaf2=st>=4?"#B9C64A":"#6DAE3C";
  g.save();g.translate(x,y);g.scale(s,s);
  const blob=(cx,cy,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,7);g.fill()};
  if(id==="grape"){
    g.strokeStyle="#6B4A2B";g.lineWidth=2.4;g.beginPath();g.moveTo(-13,2);g.lineTo(-13,-24);g.moveTo(13,2);g.lineTo(13,-24);g.stroke();
    g.lineWidth=1.2;g.beginPath();g.moveTo(-15,-20);g.lineTo(15,-20);g.stroke();
    for(let i=-1;i<=1;i++){blob(i*10,-21*k,7*k,leaf);blob(i*10+4,-24*k,5*k,leaf2)}
    if(st>=3){for(let i=-1;i<=1;i++){const cx=i*10,cy=-12;const c=st>=4?C.col:"#9DBB5A";for(let j=0;j<4;j++)blob(cx+(j%2?2:-2),cy+j*2.4,2.6,c)}}
  }else if(id==="tomato"){
    blob(0,-9*k,11*k,leaf);blob(-6,-13*k,7*k,leaf2);blob(6,-12*k,7*k,leaf2);
    if(st>=2){const c=st>=4?C.col:st>=3?"#E39B3A":"#9CC35A";blob(-5,-7,3.6,c);blob(5,-10,3.6,c);blob(1,-15,3.4,c)}
  }else if(id==="olive"){
    g.fillStyle="#6B4A2B";g.fillRect(-2,-14*k,4,14*k);
    blob(0,-22*k,13*k,"#7C8F55");blob(-7,-18*k,8*k,"#93A46A");blob(7,-19*k,8*k,"#6E8248");
    if(st>=3){const c=st>=4?"#2E2A3A":"#8FA04E";[[-5,-20],[4,-24],[7,-17],[-2,-27]].forEach(p=>blob(p[0]*k,p[1]*k,2,c))}
  }else if(id==="date"){
    g.strokeStyle="#8A6238";g.lineWidth=4;g.beginPath();g.moveTo(0,0);g.lineTo(0,-30*k);g.stroke();
    g.strokeStyle=leaf;g.lineWidth=3;g.lineCap="round";
    for(let a=0;a<7;a++){const an=Math.PI+a*Math.PI/6;g.beginPath();g.moveTo(0,-30*k);g.quadraticCurveTo(Math.cos(an)*12*k,-30*k-8*k,Math.cos(an)*20*k,-30*k+Math.abs(Math.sin(an))*-6*k+8*k);g.stroke()}
    if(st>=3){const c=st>=4?C.col:"#C9B04A";blob(-3,-26*k,3,c);blob(3,-25*k,3,c)}
  }else if(id==="cucumber"){
    for(let i=-1;i<=1;i++){blob(i*9,-5*k,7*k,leaf);blob(i*9+3,-8*k,4.5*k,leaf2)}
    if(st>=2){g.fillStyle=st>=4?"#2F6B2A":"#7DB24A";g.beginPath();g.ellipse(-4,-3,6,2.4,.3,0,7);g.fill();g.beginPath();g.ellipse(7,-4,6,2.4,-.3,0,7);g.fill()}
  }else{ // wheat, sorghum: stalks
    const head=id==="sorghum"?(st>=4?C.col:"#7DA344"):(st>=4?"#E2B64A":"#93BD4F");
    g.strokeStyle=st>=4&&id==="wheat"?"#C9A23F":"#5C9A35";g.lineWidth=1.6;
    for(let i=-2;i<=2;i++){const h=(20+((i*7)&3)*2)*k;g.beginPath();g.moveTo(i*5,0);g.lineTo(i*5+1,-h);g.stroke();
      g.fillStyle=head;g.beginPath();g.ellipse(i*5+1,-h-3*k,id==="sorghum"?3.4:2.2,6*k,0,0,7);g.fill()}
  }
  g.restore();
}

   g.fillStyle="#B8452F";g.beginPath();g.moveTo(-16,0);g.lineTo(0,8);g.lineTo(0,-14);g.lineTo(-16,-22);g.fill();

const LAT0=32.8,LAT1=31.5,LON0=35.4,LON1=36.2;
const toXY=(lat,lon,w,h)=>({x:(lon-LON0)/(LON1-LON0)*w,y:(LAT0-lat)/(LAT0-LAT1)*h});
function drawMap(){const d=devicePixelRatio||1,r=mcv.getBoundingClientRect(),w=r.width,h=r.height;mcv.width=w*d;mcv.height=h*d;mg.setTransform(d,0,0,d,0,0);
  const dark=getComputedStyle(document.documentElement).colorScheme==="dark";
  mg.fillStyle=dark?"#2A2A1E":"#E9DFC4";mg.fillRect(0,0,w,h);
  // highlands texture
  const rr=rng(5);for(let i=0;i<70;i++){mg.fillStyle=dark?"rgba(255,255,255,.035)":"rgba(140,110,60,.08)";mg.beginPath();mg.ellipse(w*(.35+rr()*.7),h*rr(),20+rr()*40,10+rr()*20,rr()*3,0,7);mg.fill()}
  // valley strip
  const river=[[32.72,35.57],[32.6,35.56],[32.45,35.58],[32.3,35.55],[32.15,35.54],[32.0,35.53],[31.85,35.54],[31.77,35.55]];
  mg.strokeStyle=dark?"rgba(110,160,70,.35)":"rgba(120,170,70,.45)";mg.lineWidth=w*.13;mg.lineCap="round";mg.lineJoin="round";mg.beginPath();river.forEach((p,i)=>{const q=toXY(p[0],p[1]+.03,w,h);i?mg.lineTo(q.x,q.y):mg.moveTo(q.x,q.y)});mg.stroke();
  mg.strokeStyle="#4C93C6";mg.lineWidth=2.5;mg.beginPath();river.forEach((p,i)=>{const q=toXY(p[0],p[1],w,h);i?mg.lineTo(q.x,q.y):mg.moveTo(q.x,q.y)});mg.stroke();
  // Dead Sea + Tiberias
  const ds=toXY(31.6,35.5,w,h);mg.fillStyle="#5BA0D0";mg.beginPath();mg.ellipse(ds.x,ds.y,w*.05,h*.1,0,0,7);mg.fill();
  const tb=toXY(32.78,35.59,w,h);mg.beginPath();mg.ellipse(tb.x,tb.y,w*.035,h*.035,0,0,7);mg.fill();
  // roads
  mg.strokeStyle=dark?"rgba(255,255,255,.18)":"rgba(90,70,40,.25)";mg.lineWidth=1.5;mg.setLineDash([5,4]);mg.beginPath();[[32.55,35.85],[32.07,35.9],[31.95,35.93]].forEach((p,i)=>{const q=toXY(p[0],p[1],w,h);i?mg.lineTo(q.x,q.y):mg.moveTo(q.x,q.y)});mg.stroke();mg.setLineDash([]);
  // labels
  const lab=(lat,lon,en,ar,big)=>{const q=toXY(lat,lon,w,h);mg.fillStyle=dark?"#E9EFDE":"#3A3324";mg.beginPath();mg.arc(q.x,q.y,big?4:3,0,7);mg.fill();mg.font=`${big?700:600} ${big?13:12}px ${css("--f-body")}`;mg.textAlign="left";mg.fillText(LANG==="ar"?ar:en,q.x+6,q.y+4)};
  lab(32.55,35.85,"Irbid","إربد");lab(31.95,35.93,"Amman","عمّان",1);lab(32.07,36.09,"Zarqa","الزرقاء");
  mg.font=`italic 600 11px ${css("--f-body")}`;mg.fillStyle="#3D7FB0";const gl=toXY(32.38,35.6,w,h);mg.save();mg.translate(gl.x,gl.y);mg.rotate(-Math.PI/2.2);mg.textAlign="center";mg.fillText(LANG==="ar"?"الغور الشمالي":"North Ghor",0,0);mg.restore();
  const dl=toXY(31.6,35.5,w,h);mg.fillStyle="#fff";mg.textAlign="center";mg.fillText(LANG==="ar"?"البحر الميت":"Dead Sea",dl.x,dl.y+3);
  // pin + area
  const q=toXY(OB.lat,OB.lon,w,h);const R=10+Math.sqrt(OB.area)*2.4;
  mg.fillStyle="rgba(71,103,42,.18)";mg.strokeStyle="#47672A";mg.lineWidth=2;mg.setLineDash([6,4]);mg.beginPath();mg.arc(q.x,q.y,R,0,7);mg.fill();mg.stroke();mg.setLineDash([]);
  if(OB.fitted){mg.fillStyle="rgba(217,142,31,.35)";mg.strokeStyle="#D98E1F";mg.lineWidth=2.5;mg.beginPath();OB.fitted.forEach((f,i)=>{const x=q.x+Math.cos(f[0])*R*f[1],y=q.y+Math.sin(f[0])*R*f[1];i?mg.lineTo(x,y):mg.moveTo(x,y)});mg.closePath();mg.fill();mg.stroke()}
  mg.fillStyle="#fff";mg.beginPath();mg.arc(q.x,q.y,9,0,7);mg.fill();mg.fillStyle="#2F7FB5";mg.beginPath();mg.arc(q.x,q.y,6,0,7);mg.fill();
  $("#coords").textContent=`${OB.lat.toFixed(3)}° N, ${OB.lon.toFixed(3)}° E`}
mcv.addEventListener("pointerdown",e=>{const r=mcv.getBoundingClientRect();OB.lon=LON0+(e.clientX-r.left)/r.width*(LON1-LON0);OB.lat=LAT0-(e.clientY-r.top)/r.height*(LAT0-LAT1);OB.fitted=null;drawMap();renderAreaOut()});
function renderAreaOut(){const a=OB.area;$("#areaOut").textContent=OB.unit==="du"?`${a} ${t("dunum")}`:`${(a/10).toFixed(1)} ${t("hectare")}`;$("#areaAlt").textContent=OB.unit==="du"?`= ${(a/10).toFixed(1)} ${t("hectare")}`:`= ${a} ${t("dunum")}`;
  $("#fitOut").textContent=OB.fitted?t("fitDone",{a:(a*.94).toFixed(1)}):t("fitTodo")}
$("#areaRange").addEventListener("input",e=>{OB.area=+e.target.value;OB.fitted=null;drawMap();renderAreaOut()});
const inValley=()=>OB.lon<35.66;
function chipsFor(el,set,ids){el.innerHTML=ids.map(id=>`<button class="chip toggle" data-id="${id}" aria-pressed="${set.has(id)}">${cName(id)}</button>`).join("");el.onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id;set.has(id)?set.delete(id):set.add(id);b.setAttribute("aria-pressed",set.has(id))}}
function renderOnboard(){
  $("#obStepLabel").textContent=t("stepOf",{n:OB.step});[1,2,3].forEach(i=>{$("#st"+i).classList.toggle("on",i<=OB.step);$("#ob"+i).hidden=i!==OB.step});
  $("#obNextBtn").textContent=OB.step===1?t("next"):OB.step===2?t("analyze"):t("goFarm");$("#obNextBtn").disabled=OB.step===3&&!OB.loaded;$("#obNextBtn").style.opacity=$("#obNextBtn").disabled?.5:1;
  if(OB.step===1){requestAnimationFrame(drawMap);renderAreaOut()}
  if(OB.step===2){if(!$("#fName").value)$("#fName").value=inValley()?L(["Valley plot","قطعة الغور"]):L(["Highland plot","قطعة المرتفعات"]);chipsFor($("#prevChips"),OB.prev,["tomato","cucumber","wheat","grape","olive"]);chipsFor($("#keepChips"),OB.keep,["grape","olive","date","tomato"]);$("#fSoil").value=OB.soil}
  if(OB.step===3){$("#ob3Title").textContent=OB.loaded?t("ob3Done"):t("ob3Load");$("#ob3Sub").textContent=OB.loaded?t("ob3DoneSub"):t("ob3LoadSub");if(OB.loaded)renderResults()}
}
function landProfile(){const v=inValley();return{elev:v?-215:780,temp:v?24.6:17.2,frost:v?3:19,rain:v?310:420,moist:v?21:26,ndvi:v?.38:.29,slope:v?1.5:6}}
function recCrops(){const v=inValley();const pr=landProfile();let list=v?[["grape",91],["tomato",88],["date",84],["olive",76],["cucumber",73],["sorghum",68],["wheat",55]]:[["olive",90],["wheat",82],["grape",78],["sorghum",70],["tomato",58],["cucumber",50],["date",22]];
  if(OB.pri==="water")list=list.map(([id,s])=>[id,s+(CROPS[id].dt?6:-4)]);OB.keep.forEach(id=>{if(!list.find(x=>x[0]===id))list.push([id,60])});return list.map(([id,s])=>[id,Math.min(97,s)]).sort((a,b)=>b[1]-a[1])}
const why={grape:["Warm winters, few frost nights, high sun","شتاء دافئ، ليالي صقيع قليلة، شمس قوية"],tomato:["Valley is frost-free most of winter","الغور خالٍ من الصقيع معظم الشتاء"],date:["Hot, dry summers; tolerates salty water","صيف حار وجاف؛ يتحمل المياه المالحة"],olive:["Low water need; drought-tolerant","حاجة قليلة للمياه؛ يتحمل الجفاف"],cucumber:["Short season fits greenhouse winter crop","موسم قصير يناسب زراعة البيوت البلاستيكية شتاءً"],sorghum:["Uses a third of maize water","يستهلك ثلث مياه الذرة"],wheat:["Rain-fed winter crop","محصول شتوي بعلي"]};
function renderResults(){$("#ob3Results").hidden=false;const pr=landProfile();
  $("#profile").innerHTML=[[`${pr.elev} m`,"SRTM · "+L(["elevation","الارتفاع"])],[`${pr.temp} °C`,"NASA POWER · "+L(["mean temp","متوسط الحرارة"])],[`${pr.moist}%`,"SMAP · "+L(["soil moisture","رطوبة التربة"])],[`${pr.rain} mm`,"GPM · "+L(["rain per year","أمطار سنوية"])],[`${pr.frost}`,"ECOSTRESS · "+L(["frost nights / yr","ليالي صقيع / سنة"])],[pr.ndvi.toFixed(2),"MODIS · NDVI"]].map(m=>`<div class="metric"><b class="mono">${m[0]}</b><span>${m[1]}</span></div>`).join("");
  const list=recCrops();if(!OB.picks.size){list.slice(0,4).forEach(x=>OB.picks.add(x[0]));OB.keep.forEach(id=>OB.picks.add(id))}
  $("#recList").innerHTML=list.map(([id,s])=>`<button class="rec" data-pick="${id}" aria-pressed="${OB.picks.has(id)}" style="text-align:start"><canvas data-icon="${id}"></canvas><div style="min-width:0"><div class="row between"><b>${cName(id)}</b><span class="mono" style="font-size:13px">${s}%</span></div><div class="bar"><i style="width:${s}%;background:${s>=75?css("--ok"):s>=55?css("--warn"):css("--danger")}"></i></div><div class="muted" style="font-size:12.5px;margin-top:4px">${L(why[id])}${OB.keep.has(id)?" · "+L(["you asked to keep this","طلبت الحفاظ عليه"]):""}</div></div><span class="check"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.4"/></svg></span></button>`).join("");
  $$("#recList canvas").forEach(c=>cropIcon(c,c.dataset.icon))}
function runAnalysis(){OB.loaded=false;$("#ob3Results").hidden=true;OB.picks.clear();
  const srcs=[["NASA POWER",L(["20 years of daily weather","20 عامًا من الطقس اليومي"])],["SMAP",L(["soil moisture, 9 km grid","رطوبة التربة، شبكة 9 كم"])],["GPM IMERG",L(["rain, last 30 days + forecast","الأمطار، آخر 30 يومًا + التوقعات"])],["SRTM",L(["elevation, 30 m","الارتفاع، 30 م"])],["MODIS NDVI",L(["vegetation, 250 m","الغطاء النباتي، 250 م"])],["ECOSTRESS",L(["land surface temperature","حرارة سطح الأرض"])]];
  $("#srcList").innerHTML=srcs.map((s,i)=>`<div class="src" id="src${i}"><span class="dot"></span><div><b>${s[0]}</b><small>${s[1]}</small></div><span class="mono muted" style="font-size:12px"></span></div>`).join("");
  srcs.forEach((s,i)=>{setTimeout(()=>$("#src"+i)?.classList.add("loading"),i*330);setTimeout(()=>{const e=$("#src"+i);if(!e)return;e.classList.remove("loading");e.classList.add("done");e.querySelector(".mono").textContent=(0.2+((i*37)%9)/10).toFixed(1)+" s"},i*330+520)});
  setTimeout(()=>{OB.loaded=true;renderOnboard()},srcs.length*330+700)}
function validateStep2(){let ok=true;OB.soil=$("#fSoil").value;const b=+$("#fBudget").value;
  $("#errSoil").hidden=!!OB.soil;$("#fSoilWrap").classList.toggle("bad",!OB.soil);if(!OB.soil)ok=false;
  $("#errBudget").hidden=b>0;$("#fBudgetWrap").classList.toggle("bad",!(b>0));if(!(b>0))ok=false;return ok}
function finishOnboard(){const v=inValley();const crops=[...OB.picks];if(!crops.length)crops.push(recCrops()[0][0]);
  const p=makePlot({name:$("#fName").value.trim()||"Plot",region:v?L(["North Ghor","الغور الشمالي"]):L(["Amman highlands","مرتفعات عمّان"]),lat:OB.lat,lon:OB.lon,area:OB.area,crops,soil:OB.soil==="auto"?"loam":OB.soil,water:+$("#fWater").value||300,valley:v,seed:Math.round(OB.lat*1000)%997+3});
  S.plots.push(p);S.cur=S.plots.length-1;S.sel=null;S.tool=null;enterMain(true)}

/* ---------------- screens ---------------- */
function show(id){["welcome","onboard","main"].forEach(k=>$("#scr-"+k).hidden=k!==id)}
function startOnboard(){Object.assign(OB,{step:1,fitted:null,loaded:false,soil:""});OB.picks.clear();$("#fName").value="";$("#areaRange").value=OB.area;show("onboard");closeSheet();renderOnboard()}
function enterMain(tut){show("main");switchTab("farm");renderAll();requestAnimationFrame(()=>{sizeFarm();if(tut&&!S.tutorialSeen)setTimeout(()=>coach(0),300)})}

/* ---------------- tutorial coach marks ---------------- */
const COACH=[["#sidebar .sb-crop","c1t","c1b"],["#farmCanvas","c2t","c2b"],["#toolSickle","c3t","c3b"],["#tabAlerts","c4t","c4b"],["#rpChip","c5t","c5b"]];
function coach(i){closeCoach();if(i>=COACH.length){S.tutorialSeen=true;return}if(S.tab!=="farm")switchTab("farm");const el=$(COACH[i][0]);if(!el){coach(i+1);return}
  const app=$("#app").getBoundingClientRect(),r=el.getBoundingClientRect();const pad=6;const l=$("#layer");
  const ring=document.createElement("div");ring.className="coach-ring";Object.assign(ring.style,{left:r.left-app.left-pad+"px",top:r.top-app.top-pad+"px",width:r.width+pad*2+"px",height:(i===1?Math.min(r.height,app.height*.5):r.height)+pad*2+"px"});
  const card=document.createElement("div");card.className="coach-card";const below=r.top-app.top<app.height/2&&i!==1;card.style[below?"top":"bottom"]=below?(r.bottom-app.top+16+"px"):(app.bottom-r.top+16)+"px";if(i===1){card.style.bottom="90px";card.style.top=""}
  card.innerHTML=`<h3>${t(COACH[i][1])}</h3><p>${t(COACH[i][2])}</p><div class="row between"><div class="dots">${COACH.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><div class="row"><button class="btn sm ghost" data-act="coachSkip">${t("skip")}</button><button class="btn sm" data-act="coachNext" data-i="${i+1}">${i===COACH.length-1?t("gotIt"):t("next")}</button></div></div>`;
  l.append(ring,card)}
function closeCoach(){$$("#layer .coach-ring,#layer .coach-card").forEach(e=>e.remove())}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;if(e.target.closest("#toolSickle"))return}
  const a=e.target.closest("[data-act]");const act=a?.dataset.act;
  const crop=e.target.closest(".sb-crop");if(crop){const id=crop.dataset.crop;S.sel=S.sel===id?null:id;S.tool=null;renderSidebar();refreshHint();return}
  const tool=e.target.closest(".tool");if(tool){const k=tool.dataset.tool;S.sel=null;
    if(k==="topo"){S.topo=!S.topo}else if(k==="sickle"){S.tool=null;showHarvestDates()}else{S.tool=S.tool===k?null:k;if(k==="water"&&!P().tiles.some(thirsty))toast(t("noWater"))}renderSidebar();refreshHint();return}
  const tab=e.target.closest(".tab");if(tab){switchTab(tab.dataset.tab);return}
  const pick=e.target.closest("[data-pick]");if(pick){const id=pick.dataset.pick;OB.picks.has(id)?OB.picks.delete(id):OB.picks.add(id);pick.setAttribute("aria-pressed",OB.picks.has(id));return}
  const slot=e.target.closest(".slot");if(slot){const i=+slot.dataset.slot,x=S._spray[i];const msg=$("#sprayMsg");
    if(x.z==="r"){msg.innerHTML=`<div class="note" style="background:var(--danger-soft)"><span>${t("locked",{why:x.why})}</span></div>`;slot.animate?.([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:200});return}
    if(x.z==="y"&&S._pendingY!==i){S._pendingY=i;msg.innerHTML=`<div class="note"><span>${t("caution",{why:x.why})}</span></div>`;return}
    const first=S.spray.slot===null;S.spray.slot=i;S._pendingY=null;if(x.z==="g"&&first)addRP(20);renderSpray();$("#sprayMsg").innerHTML=`<div class="note ok"><span>${t("scheduled",{d:S._days[x.d],h:String(x.h).padStart(2,"0")}).replace(" · +20 RP",x.z==="g"&&first?" · +20 RP":"").replace(" · +20 نقطة",x.z==="g"&&first?" · +20 نقطة":"")}</span></div>`;return}
  const seg=e.target.closest(".seg button");if(seg&&!act){const p=seg.parentElement;
    if(seg.dataset.unit){OB.unit=seg.dataset.unit;p.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===seg));renderAreaOut();return}
    p.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===seg));
    if(p.id==="segIrr")OB.irr=seg.dataset.v;if(p.id==="segPri")OB.pri=seg.dataset.v;if(p.id==="sprayTool")S.spray.tool=seg.dataset.v;
    if(p.id==="langSeg"){LANG=seg.dataset.v;renderAll()}return}
  switch(act){
   case"lang":LANG=LANG==="en"?"ar":"en";renderAll();break;
   case"startOnboard":startOnboard();break;
   case"openSample":if(!S.plots.some(p=>p.name==="Abu Saleh vineyard"))S.plots.unshift(samplePlot());S.cur=0;enterMain(true);break;
   case"locate":OB.lat=32.47;OB.lon=35.61;OB.area=60;$("#areaRange").value=60;OB.fitted=null;drawMap();renderAreaOut();toast(t("located"));break;
   case"autofit":{const r=rng(Math.round(OB.lat*1e4));OB.fitted=[...Array(7)].map((_,i)=>[i/7*Math.PI*2+r()*.3,.72+r()*.25]);drawMap();renderAreaOut();break}
   case"obBack":if(OB.step===1){show(S.plots.length?"main":"welcome");if(S.plots.length)enterMain(false)}else{OB.step--;renderOnboard()}break;
   case"obNext":if(OB.step===1){OB.step=2;renderOnboard()}else if(OB.step===2){if(validateStep2()){OB.step=3;renderOnboard();runAnalysis()}}else if(OB.loaded)finishOnboard();break;
   case"closeSheet":closeSheet();break;
   case"waitRain":S.rainAsked=true;P().tiles.filter(thirsty).forEach(tl=>tl.wait=true);addRP(15);closeSheet();toast(t("waiting"));renderSidebar();break;
   case"waterAnyway":{S.rainAsked=true;const tl=P().tiles[+a.dataset.i];closeSheet();waterTile(tl);renderSidebar();break}
   case"week":simWeek();break;
   case"goAlerts":switchTab("alerts");break;
   case"goSeed":switchTab("plan");setTimeout(()=>$("#tab-plan .grade-big")?.scrollIntoView({behavior:"smooth",block:"center"}),50);break;
   case"deploy":{const al=S.alerts.find(x=>x.id===a.dataset.a);al.done.push(+a.dataset.i);addRP(20);renderAlerts();renderHUD();break}
   case"unlock":P().crops.push(a.dataset.id);renderPlan();renderSidebar();break;
   case"plots":sheet(`<div class="stack"><h2 style="font-size:22px">${t("myPlots")}</h2>${S.plots.map((p,i)=>`<button class="list-item${i===S.cur?" on":""}" data-act="switchPlot" data-i="${i}"><div style="flex:1;min-width:0"><b>${p.name}</b><div class="muted" style="font-size:13px">${p.region} · ${p.area} ${t("dunum")}</div></div></button>`).join("")}<button class="btn" data-act="startOnboard">+ ${t("addPlot")}</button></div>`);break;
   case"switchPlot":S.cur=+a.dataset.i;S.sel=null;closeSheet();renderAll();break;
   case"tutorial":switchTab("farm");setTimeout(()=>coach(0),120);break;
   case"coachNext":coach(+a.dataset.i);break;
   case"coachSkip":closeCoach();S.tutorialSeen=true;break;
  }
});
$("#app").addEventListener("pointerdown",e=>{const b=e.target.closest("#toolSickle");if(b)sickleDown({currentTarget:b,clientX:e.clientX,clientY:e.clientY})});
$("#app").addEventListener("contextmenu",e=>{if(e.target.closest("#toolSickle,#farmCanvas"))e.preventDefault()});
addEventListener("resize",()=>{if(!$("#scr-main").hidden)sizeFarm();if(!$("#scr-onboard").hidden&&OB.step===1)drawMap()});

initAlerts();applyI18n();requestAnimationFrame(loop);
})();
</script>
