<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#47672A">
<title>Farm Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app" id="app">

  <!-- AUTH -->
  <section class="screen" id="scr-auth">
    <div class="auth">
      <button class="chip lang-switch" data-act="lang"><span data-t="langBtn"></span></button>
      <canvas id="welcomeCanvas" aria-hidden="true"></canvas>
      <form class="panel pad stack" id="authForm" novalidate>
        <div class="logo">
          <div class="logo-mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 21V10"/><path d="M12 13c-4 0-6-3-6-6 3 0 6 2 6 6Z" fill="#fff" fill-opacity=".25"/><path d="M12 11c0-4 3-7 7-7 0 4-3 7-7 7Z" fill="#fff" fill-opacity=".25"/><circle cx="18.5" cy="18.5" r="2.3"/></svg></div>
          <h1 data-t="appName"></h1>
        </div>
        <p class="muted" style="margin:0" data-t="tagline"></p>
        <div class="seg" id="authMode"><button type="button" data-v="login" aria-pressed="true" data-t="signIn"></button><button type="button" data-v="register" aria-pressed="false" data-t="createAccount"></button></div>
        <div class="field" id="nameField" hidden><label class="label" for="aName" data-t="yourName"></label><input id="aName" autocomplete="name"></div>
        <div class="field"><label class="label" for="aEmail" data-t="email"></label><input id="aEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label class="label" for="aPass" data-t="password"></label><input id="aPass" type="password" autocomplete="current-password" minlength="8" required></div>
        <div class="err-box" id="authErr" hidden></div>
        <button class="btn block" type="submit" id="authBtn"></button>
      </form>
    </div>
  </section>

  <!-- ONBOARDING -->
  <section class="screen" id="scr-onboard" hidden>
    <div class="ob-head pad">
      <div class="row between"><span class="label" id="obStepLabel"></span><button class="chip" data-act="lang"><span data-t="langBtn"></span></button></div>
      <div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i></div>
    </div>

    <div class="scroll pad" id="ob1">
      <div class="stack">
        <div><h2 data-t="ob1Title" style="font-size:26px"></h2><p class="muted" style="margin:4px 0 0" data-t="ob1Sub"></p></div>
        <div id="leafletMap" role="application" aria-label="Map: tap to add the corners of your field"></div>
        <div class="map-tools">
          <button class="btn sm" data-act="locate"><span data-t="useLoc"></span></button>
          <button class="btn sm ghost" data-act="undoCorner" data-t="undo"></button>
          <button class="btn sm ghost" data-act="clearCorners" data-t="clear"></button>
        </div>
        <div class="card stack" style="gap:10px">
          <div class="row between"><span class="label" data-t="area"></span><b class="mono" id="areaOut">–</b></div>
          <span class="muted" style="font-size:13px" id="cornerHint"></span>
          <details><summary class="muted" style="cursor:pointer" data-t="noCorners"></summary>
            <div class="stack" style="gap:8px;margin-top:10px">
              <label class="label" for="sqArea" data-t="areaDunum"></label>
              <input id="sqArea" type="number" inputmode="decimal" min="0.1" step="0.1" value="10">
              <button class="btn sm ghost" data-act="square" data-t="makeSquare"></button>
            </div>
          </details>
        </div>
      </div>
    </div>

    <div class="scroll pad" id="ob2" hidden>
      <div class="stack">
        <div><h2 data-t="ob2Title" style="font-size:26px"></h2><p class="muted" style="margin:4px 0 0" data-t="ob2Sub"></p></div>
        <div class="field" id="fNameWrap"><label class="label" for="fName"><span data-t="plotName"></span> · <span data-t="required"></span></label><input id="fName" autocomplete="off" maxlength="120"><span class="err" hidden data-t="errName"></span></div>
        <div class="field" id="fSoilWrap"><label class="label" for="fSoil"><span data-t="soil"></span> · <span data-t="required"></span></label>
          <select id="fSoil"><option value="" data-t="choose"></option><option value="auto" data-t="soilAuto"></option><option value="loam" data-t="soilLoam"></option><option value="clay" data-t="soilClay"></option><option value="sandy" data-t="soilSandy"></option><option value="calc" data-t="soilCalc"></option></select>
          <span class="err" hidden data-t="errSoil"></span></div>
        <div class="field"><span class="label" data-t="farmType"></span>
          <div class="seg" id="segIrr"><button data-v="rain" aria-pressed="false" data-t="rainfed"></button><button data-v="irr" aria-pressed="true" data-t="irrigated"></button><button data-v="both" aria-pressed="false" data-t="both"></button></div></div>
        <div class="field" id="fWaterWrap"><label class="label" for="fWater" data-t="waterAvail"></label><input id="fWater" type="number" inputmode="decimal" min="0"><span class="err" hidden data-t="errWater"></span></div>
        <div class="field" id="fBudgetWrap"><label class="label" for="fBudget"><span data-t="budget"></span> · <span data-t="required"></span></label><input id="fBudget" type="number" inputmode="decimal" min="0"><span class="err" hidden data-t="errBudget"></span></div>
        <div class="field"><span class="label" data-t="prevCrops"></span><div class="chips" id="prevChips"></div></div>
        <div class="field"><span class="label" data-t="keepCrops"></span><div class="chips" id="keepChips"></div></div>
        <div class="field"><span class="label" data-t="priority"></span>
          <div class="seg" id="segPri"><button data-v="water" aria-pressed="true" data-t="priWater"></button><button data-v="soil" aria-pressed="false" data-t="priSoil"></button><button data-v="cost" aria-pressed="false" data-t="priCost"></button></div></div>
      </div>
    </div>

    <div class="scroll pad" id="ob3" hidden>
      <div class="stack">
        <div><h2 id="ob3Title" style="font-size:26px"></h2><p class="muted" style="margin:4px 0 0" id="ob3Sub"></p></div>
        <div class="src-list" id="srcList"></div>
        <div class="err-box" id="ob3Err" hidden></div>
        <div id="ob3Results" class="stack" hidden>
          <div class="sec-title"><h2 data-t="landProfile"></h2></div>
          <div class="profile" id="profile"></div>
          <div id="trendNote"></div>
          <div class="sec-title"><h2 data-t="recCrops"></h2></div>
          <p class="muted" style="margin:-8px 0 0;font-size:14px" data-t="pickCrops"></p>
          <div class="stack" style="gap:8px" id="recList"></div>
        </div>
      </div>
    </div>

    <div class="ob-foot pad">
      <button class="btn ghost" data-act="obBack" data-t="back"></button>
      <button class="btn" data-act="obNext" id="obNextBtn"></button>
    </div>
  </section>

  <!-- MAIN -->
  <section class="screen" id="scr-main" hidden>
    <div class="hud pad">
      <button class="plot-btn" data-act="plots" id="plotBtn"><b id="plotName"></b><span id="plotMeta"></span></button>
      <span class="chip rp" id="rpChip"><span class="coin"></span><b class="mono" id="rpVal">0</b><span data-t="rp"></span></span>
      <button class="chip" data-act="goPlan" id="gradeChip"><span data-t="resilience"></span><b class="grade" id="gradeVal">–</b></button>
      <span class="chip" id="wxChip"></span>
    </div>

    <div class="screen" id="tab-farm">
      <div class="stage" id="stage">
        <canvas id="farmCanvas" aria-label="Your farm"></canvas>
        <div class="vignette" id="vignette"></div>
        <div class="banner" id="banner" hidden></div>
        <aside class="sidebar" id="sidebar" aria-label="Crops and tools"></aside>
        <button class="btn sm ghost weekbtn" data-act="refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span data-t="refresh"></span></button>
        <div class="hint" id="hint" hidden></div>
        <div class="loading-cover" id="farmLoading" hidden><div class="box"><span class="spinner"></span><span data-t="loading"></span></div></div>
      </div>
    </div>
    <div class="screen scroll pad" id="tab-plan" hidden></div>
    <div class="screen scroll pad" id="tab-spray" hidden></div>
    <div class="screen scroll pad" id="tab-alerts" hidden></div>
    <div class="screen scroll pad" id="tab-more" hidden></div>

    <nav class="tabbar" role="tablist">
      <button class="tab" role="tab" data-tab="farm" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg><span data-t="tFarm"></span></button>
      <button class="tab" role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="tPlan"></span></button>
      <button class="tab" role="tab" data-tab="spray" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg><span data-t="tSpray"></span></button>
      <button class="tab" role="tab" data-tab="alerts" aria-selected="false" id="tabAlerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l10 18H2Z"/><path d="M12 10v5M12 18v.5"/></svg><span data-t="tAlerts"></span><span class="count" id="alertCount" hidden></span></button>
      <button class="tab" role="tab" data-tab="more" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span data-t="tMore"></span></button>
    </nav>
  </section>

  <div id="layer"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
